<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dr. Butterfly Clinic">
  <title>Dr. Butterfly Clinic</title>
  <!--
    Favicon constraints drove this shape:
    - It renders at 16px in a tab strip, so the silhouette is deliberately bold
      and symmetrical; the detailed wing veins of the in-app logo disappear at
      that size and only muddy the outline.
    - It has to sit on both a white and a near-black tab bar, so the palette
      stays in the mid-to-bright blues (#38bdf8 - #4338ca). A navy would vanish
      against dark Chrome; a pastel would vanish against light Chrome.
    - The body is a lighter blue rather than a dark stroke, so the two wing
      masses stay visually separated on dark backgrounds too.
  -->
  <defs>
    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="wingR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <!-- upper wings: the large mass that carries recognition at small sizes -->
  <path d="M30 30 C24 12, 8 5, 5 19 C2.5 31, 16 37, 30 33 Z" fill="url(#wingL)"/>
  <path d="M34 30 C40 12, 56 5, 59 19 C61.5 31, 48 37, 34 33 Z" fill="url(#wingR)"/>

  <!-- lower wings: smaller, slightly deeper in tone to give the form weight -->
  <path d="M30 34 C25 44, 11 52, 9 41 C7.5 32, 20 32, 30 34 Z" fill="url(#wingL)" opacity="0.9"/>
  <path d="M34 34 C39 44, 53 52, 55 41 C56.5 32, 44 32, 34 34 Z" fill="url(#wingR)" opacity="0.9"/>

  <!-- body: light enough to read as a separator against a dark tab bar -->
  <rect x="30" y="16" width="4" height="30" rx="2" fill="url(#bodyGrad)"/>
  <circle cx="32" cy="16" r="3.2" fill="#e0f2fe"/>

  <!-- antennae: lost at 16px by design, present at 32px and above -->
  <path d="M32 14 C29 9, 26 7, 23.5 6.5" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M32 14 C35 9, 38 7, 40.5 6.5" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
